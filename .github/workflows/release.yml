name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z, without v)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      BASE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require main
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "$SELECTED_REF" != refs/heads/main ]]; then
            echo "Run releases from main." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare version and release notes
        run: |
          python3 .github/scripts/prepare_release.py "$RELEASE_VERSION" --notes "$RUNNER_TEMP/release-notes.md"
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo "Tag v$RELEASE_VERSION already exists." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "Release v$RELEASE_VERSION"
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal --component clippy --component rustfmt
      - name: Check release tooling
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Validate release commit and package
        run: bash .github/scripts/check.sh check
      - name: Validate feature selections
        run: |
          for features in "" rustls-tls reqwest ureq ureq,rustls-tls; do
            bash .github/scripts/check.sh features "$features"
          done
      - name: Push release commit and tag together
        run: bash .github/scripts/push_release.sh
      - name: Create GitHub Release
        run: |
          gh release create "v$RELEASE_VERSION" --verify-tag \
            --title "v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Show local publishing commands
        run: |
          {
            echo "## v$RELEASE_VERSION is tagged; crates.io publishing is still manual"
            echo
            echo 'Run locally from your repository:'
            echo '```sh'
            echo 'git fetch origin --tags'
            echo "git worktree add --detach ../typesafe-ai-release-$RELEASE_VERSION v$RELEASE_VERSION"
            echo "cd ../typesafe-ai-release-$RELEASE_VERSION"
            echo 'cargo publish --locked --dry-run'
            echo 'cargo publish --locked'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
