name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal --component clippy --component rustfmt
      - name: Check release tooling
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Validate crate and package
        run: bash .github/scripts/check.sh check

  features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "rustls-tls", "reqwest", "ureq", "ureq,rustls-tls"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Test feature selection
        run: bash .github/scripts/check.sh features "$FEATURES"
        env:
          FEATURES: ${{ matrix.features }}
